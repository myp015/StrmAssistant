name: Build Plugin

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 只获取最新提交，加快克隆速度

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.x'

      # 缓存NuGet包，大幅提升构建速度
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore StrmAssistant/StrmAssistant.csproj

      - name: Build the project
        run: dotnet build StrmAssistant/StrmAssistant.csproj --no-restore --configuration Release -p:UseSharedCompilation=false

      # 收集编译产物（ILRepack 打包后的最终 DLL）
      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Get-ChildItem -Path "StrmAssistant/bin/Release/net6.0/StrmAssistant.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination artifact/
          Get-ChildItem -Path "StrmAssistant/bin/Release/StrmAssistant.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination artifact/
          Get-ChildItem artifact/ | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrmAssistant-${{ github.run_number }}
          path: artifact/*
          compression-level: 0  # DLL已经是二进制，不需要压缩
          retention-days: 30

      # 发布到 Release（资产无需认证即可下载，便于 DSM 部署）
      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StrmAssistant build #${{ github.run_number }}
          body: |
            Auto-build from commit ${{ github.sha }}
            Emby 4.9 / 4.10 compatible
          files: artifact/StrmAssistant.dll
          fail_on_unmatched_files: false
